<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spout Pouch Icon - CORRECTED</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      background: white;
      padding: 60px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 600px;
    }
    h1 {
      color: #111827;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #6b7280;
      margin-bottom: 40px;
      font-size: 16px;
    }
    .icon-display {
      background: #f9fafb;
      padding: 40px;
      border-radius: 16px;
      margin-bottom: 30px;
      border: 3px solid #e5e7eb;
    }
    svg {
      width: 160px;
      height: 180px;
      stroke: #111827;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.3s ease;
    }
    svg:hover {
      transform: scale(1.05);
    }
    .label {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 600;
      color: #111827;
    }
    .description {
      color: #6b7280;
      font-size: 14px;
      margin-top: 8px;
    }
    .approval {
      background: #10b981;
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      margin-top: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ Spout Pouch Icon - CORRECTED</h1>
    <p class="subtitle">Side Spout Style - Exact Like Reference</p>
    
    <div class="icon-display">
      <svg viewBox="0 0 120 140">
        <!-- Spout cap at top left corner -->
        <rect x="30" y="10" width="15" height="10" rx="2"/>
        
        <!-- Spout neck angled -->
        <path d="M32 20 L30 28 L35 35"/>
        <path d="M43 20 L45 28 L40 35"/>
        
        <!-- Main pouch body - rectangular with curves -->
        <path d="M35 35 L25 40 Q20 45 20 55 L20 115 Q20 125 30 130 L90 130 Q100 125 100 115 L100 55 Q100 45 95 40 L85 35"/>
        
        <!-- Top seal/opening area -->
        <path d="M35 35 L85 35 Q95 37 95 45"/>
        <path d="M25 40 Q20 42 20 45"/>
        
        <!-- Label rectangle in center -->
        <rect x="40" y="65" width="40" height="30" rx="2"/>
        
        <!-- Side gusset lines -->
        <line x1="25" y1="50" x2="25" y2="120" stroke-opacity="0.3"/>
        <line x1="95" y1="50" x2="95" y2="120" stroke-opacity="0.3"/>
        
        <!-- Bottom curve detail -->
        <path d="M30 130 Q60 125 90 130" stroke-opacity="0.4" stroke-dasharray="3,3"/>
      </svg>
      
      <div class="label">Spout Pouch (Corrected)</div>
      <div class="description">Side spout design - like reference image</div>
    </div>
    
    <div class="approval">✓ REVIEW THIS VERSION</div>
  </div>
</body>
</html>
