<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spout Pouch Icons - Preview</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      background: white;
      padding: 60px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 600px;
    }
    h1 {
      color: #111827;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #6b7280;
      margin-bottom: 40px;
      font-size: 16px;
    }
    .icon-display {
      background: #f9fafb;
      padding: 40px;
      border-radius: 16px;
      margin-bottom: 30px;
      border: 3px solid #e5e7eb;
    }
    svg {
      width: 160px;
      height: 160px;
      stroke: #111827;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.3s ease;
    }
    svg:hover {
      transform: scale(1.1);
    }
    .label {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 600;
      color: #111827;
    }
    .description {
      color: #6b7280;
      font-size: 14px;
      margin-top: 8px;
    }
    .approval {
      background: #f59e0b;
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      margin-top: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Spout Pouch Icon</h1>
    <p class="subtitle">Line Art Style - Clean & Professional</p>
    
    <div class="icon-display">
      <svg viewBox="0 0 120 120">
        <!-- Spout cap -->
        <rect x="48" y="15" width="24" height="12" rx="2"/>
        <line x1="52" y1="27" x2="52" y2="35"/>
        <line x1="68" y1="27" x2="68" y2="35"/>
        
        <!-- Spout neck -->
        <path d="M52 35 L48 45 L48 50 Q48 52 50 52 L70 52 Q72 52 72 50 L72 45 L68 35"/>
        
        <!-- Main pouch body -->
        <path d="M45 52 L42 60 Q40 70 40 80 L40 100 Q40 108 48 108 L72 108 Q80 108 80 100 L80 80 Q80 70 78 60 L75 52"/>
        
        <!-- Label rectangle -->
        <rect x="50" y="68" width="20" height="16" rx="2"/>
        
        <!-- Bottom gusset lines -->
        <path d="M48 108 L60 100 L72 108" stroke-dasharray="3,3"/>
        
        <!-- Pouch sides detail -->
        <path d="M45 52 Q35 60 35 80 L35 100" stroke-opacity="0.3"/>
        <path d="M75 52 Q85 60 85 80 L85 100" stroke-opacity="0.3"/>
      </svg>
      
      <div class="label">Spout Pouch</div>
      <div class="description">Spouted pouches for liquids & purées</div>
    </div>
    
    <div class="approval">✓ READY FOR APPROVAL</div>
  </div>
</body>
</html>
